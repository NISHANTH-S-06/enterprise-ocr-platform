name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (PaddleOCR skipped; tests use fixtures)
        run: |
          grep -v -i paddle requirements.txt > /tmp/req.txt
          pip install -r /tmp/req.txt pymupdf aiosqlite pytest
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider -W ignore
